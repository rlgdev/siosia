<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <script>
      // Appearance (V50): this phone's choice goes on <html> before any CSS paints, so a fixed
      // light or dark never flashes the other mode; the meta colour follows the shown mode.
      try {
        var t = JSON.parse(localStorage.getItem("siosia.theme"));
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0b1020" : "#eef2f7";
      } catch (e) {}
    </script>
    <meta name="description" content="Siosia — ride or drive from one link. Mobile-first ride-hailing web app." />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Siosia</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Siosia needs JavaScript and an internet connection.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
